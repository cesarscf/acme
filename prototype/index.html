<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9ECEF}
a{color:#0E7C5A}a:hover{color:#0A5A42}
*{box-sizing:border-box}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.b{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.b:disabled{cursor:default}
.btn{height:54px;border-radius:16px;border:0;font:inherit;font-weight:700;font-size:16px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;flex:none}
.btn-p{background:var(--ac);color:#fff}
.btn-p:disabled{opacity:.32;cursor:default}
.btn-g{background:rgba(255,255,255,.12);color:#fff}
.btn-s{background:#fff;color:#14181F;border:1px solid #DFE3E8}
.btn:active{transform:scale(.985)}
.lnk{border:0;background:none;font:inherit;font-weight:700;font-size:15px;color:#14181F;cursor:pointer;padding:12px;min-height:44px}
.ib{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid #E3E6EA;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#14181F;padding:0;flex:none}
.h1{font-size:29px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:0}
.sub{color:#555E6C;font-size:15px;line-height:1.45;margin:8px 0 0}
.field{height:56px;border-radius:16px;border:1.5px solid #DFE3E8;background:#fff;padding:0 16px;font:inherit;font-size:16px;width:100%;color:#14181F}
.field:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px var(--acs)}
.card{background:#fff;border-radius:20px;border:1px solid #E9ECEF}
.sheetbg{position:absolute;inset:0;background:rgba(14,19,25,.42);animation:fade .2s ease-out;z-index:40;border:0;padding:0;width:100%;cursor:default}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px 30px;animation:up .3s cubic-bezier(.2,.8,.2,1);max-height:90%;display:flex;flex-direction:column;z-index:41}
.grab{width:40px;height:5px;border-radius:9px;background:#D7DBE0;margin:0 auto 16px;flex:none}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:none;font:inherit;text-align:left;cursor:pointer;border-top:1px solid #F0F2F4;color:#14181F;min-height:52px}
.opt:hover{background:#F8F9FA}
.opt:disabled{opacity:.5;cursor:default;background:none}
.key{width:28px;height:28px;border-radius:8px;background:#F0F2F4;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#5E6774;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:7px 0;font-size:14px;line-height:1.4}
.kv dt{color:#5E6774}
.kv dd{margin:0;color:#14181F}
.float{animation:bob 5.5s ease-in-out infinite}
.msg{animation:in .28s ease-out}
.think{animation:pulse 1.2s ease-in-out infinite}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:10px 20px;min-height:68px}
.row:hover{background:#F2F4F6}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ac);flex:none}
.recdot{animation:pulse 1s ease-in-out infinite}
.wave span{display:block;width:3px;border-radius:3px;background:#fff;animation:wave 1s ease-in-out infinite}
.new{position:relative}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1)}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes wave{0%,100%{height:6px}50%{height:18px}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-8px)}100%{opacity:1;transform:translate(-50%,0)}}
</style>

<style>
html,body{height:100%}
body{margin:0;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#E4E7EB;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.bar{display:flex;align-items:center;gap:10px;font-size:13px;color:#4A5260;flex-wrap:wrap;justify-content:center;padding:0 12px}
.bar button{font:inherit;font-weight:700;border:1px solid #CBD0D7;background:#fff;border-radius:99px;padding:7px 14px;cursor:pointer;color:#14181F}
#stage{position:relative}
#phone{width:390px;height:844px;transform-origin:top left;position:absolute;top:0;left:0;border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #14181F,0 30px 80px rgba(0,0,0,.28)}
</style>
</head>
<body>
<div class="bar">
  <span>Protótipo · clique para navegar</span>
  <button type="button" onclick="location.reload()">Recomeçar</button>
  <button type="button" onclick="window.__app && window.__app.jump('clients')">Ir para Clientes</button>
  <button type="button" onclick="window.__app && window.__app.jump('joao')">Abrir o João</button>
</div>
<div id="stage"><div id="phone"><div id="app"></div></div></div>
<template id="tpl">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F6F8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14181F; --ac: {{accent}}; --acs: {{accentSoft}}">

<!-- ============ 1. BOAS-VINDAS ============ -->
<sc-if value="{{isWelcome}}">
<div class="scr" style="background: #0E1A15; color: #fff">
  <div style="position: relative; height: 470px; flex: none">
    <sc-for list="{{welcomeMascots}}" as="w">
      <div class="float" style="{{w.pos}}">
        <div style="{{w.m.wrap}}"><div style="{{w.m.body}}"><span style="{{w.m.eye}}"></span><span style="{{w.m.eye}}"></span></div></div>
      </div>
    </sc-for>
    <div style="position: absolute; left: 62px; top: 150px; width: 266px; display: flex; flex-direction: column; gap: 8px">
      <div style="align-self: flex-start; background: rgba(255,255,255,.1); color: #E8EEEB; padding: 10px 14px; border-radius: 18px 18px 18px 6px; font-size: 13.5px; line-height: 1.4">Boa tarde! Tem horário amanhã pra limpar o ar?</div>
      <div style="align-self: flex-end; background: #fff; color: #14181F; padding: 10px 14px; border-radius: 18px 18px 6px 18px; font-size: 13.5px; line-height: 1.4; max-width: 230px">
        <div style="font-size: 11px; font-weight: 700; color: {{accent}}; margin-bottom: 2px">Lia · Agenda</div>
        Tenho às 9h ou às 14h. Qual fica melhor?
      </div>
      <div style="align-self: flex-end; display: flex; gap: 6px">
        <span class="pill" style="background: rgba(255,255,255,.14); color: #fff; height: 28px; padding: 0 12px">Aprovar</span>
        <span class="pill" style="background: rgba(255,255,255,.06); color: #C9D3CF; height: 28px; padding: 0 12px">Editar</span>
      </div>
    </div>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 22px 34px; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px">
      <div style="width: 26px; height: 26px; border-radius: 8px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <div style="width: 10px; height: 10px; border-radius: 3px; background: #fff"></div>
      </div>
      <span style="font-size: 20px; font-weight: 800; letter-spacing: -.02em">Acme</span>
    </div>
    <h1 style="margin: 0; font-size: 28px; line-height: 1.18; font-weight: 800; letter-spacing: -.02em; text-align: center">Uma equipe que cuida do escritório enquanto você trabalha.</h1>
    <p style="margin: 0 0 14px; text-align: center; color: #B8C4BF; font-size: 15px; line-height: 1.45">Assistentes de IA para a rotina do seu serviço.<br>Grátis para começar.</p>
    <button class="btn btn-p" onClick="{{goPhone}}">Começar</button>
    <button class="btn btn-g" onClick="{{goPhone}}">Já tenho conta</button>
  </div>
</div>
</sc-if>

<!-- ============ 2. SEU WHATSAPP ============ -->
<sc-if value="{{isPhone}}">
<div class="scr" style="background: #fff; padding: 18px 20px 30px">
  <button class="ib" aria-label="Voltar" onClick="{{goWelcome}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
  <h1 class="h1" style="margin-top: 28px">Seu WhatsApp</h1>
  <p class="sub">Mandamos um código para entrar. Sem senha.</p>
  <label style="position: absolute; left: -9999px" for="ph">Número com DDD</label>
  <input id="ph" class="field" style="margin-top: 22px" value="(11) 98765-4321" inputmode="tel" readonly>
  <div style="flex: 1"></div>
  <button class="btn btn-p" onClick="{{goCode}}">Enviar código</button>
</div>
</sc-if>

<!-- ============ 3. CÓDIGO ============ -->
<sc-if value="{{isCode}}">
<div class="scr" style="background: #fff; padding: 18px 20px 30px">
  <button class="ib" aria-label="Voltar" onClick="{{goPhone}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
  <h1 class="h1" style="margin-top: 28px">Confirme que é você</h1>
  <p class="sub">Digite o código de 6 dígitos que chegou no seu WhatsApp.</p>
  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 22px">
    <sc-for list="{{codeDigits}}" as="cd">
      <div style="height: 54px; border-radius: 14px; border: 1.5px solid #DFE3E8; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">{{cd}}</div>
    </sc-for>
  </div>
  <div style="flex: 1"></div>
  <button class="btn btn-p" onClick="{{goName}}">Confirmar</button>
</div>
</sc-if>

<!-- ============ 4. NOME + O QUE FAZ ============ -->
<sc-if value="{{isName}}">
<div class="scr" style="background: #fff; padding: 18px 20px 30px">
  <h1 class="h1" style="margin-top: 72px">Como quer ser chamado?</h1>
  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 22px">
    <label style="position: absolute; left: -9999px" for="nm">Seu nome</label>
    <input id="nm" class="field" placeholder="Ex.: Carlos da Refrigeração" value="{{name}}" onChange="{{onName}}" autocomplete="off">
    <button class="field" style="display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left" onClick="{{openSegs}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E6774" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></svg>
      <span style="{{segStyle}}">{{segLabel}}</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6774" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </div>
  <div style="flex: 1"></div>
  <button class="btn btn-p" disabled="{{nameEmpty}}" onClick="{{goProfile}}">Continuar</button>
</div>
</sc-if>

<!-- ============ 5. COMO TRABALHA ============ -->
<sc-if value="{{isProfile}}">
<div class="scr" style="background: #fff; padding: 18px 20px 24px">
  <button class="ib" aria-label="Voltar" onClick="{{goName}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
  <h1 class="h1" style="margin-top: 28px">Como você trabalha hoje?</h1>
  <p class="sub">Assim eu monto a equipe certa para você.</p>
  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 22px">
    <sc-for list="{{profiles}}" as="p">
      <button class="b" style="{{p.style}}" onClick="{{p.pick}}">
        <div style="width: 54px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 3px; flex: none">
          <sc-for list="{{p.people}}" as="pp">
            <div style="{{pp}}"></div>
          </sc-for>
        </div>
        <div style="flex: 1">
          <div style="font-weight: 700; font-size: 16px">{{p.t}}</div>
          <div style="color: #5E6774; font-size: 13.5px; margin-top: 2px">{{p.d}}</div>
        </div>
        <div style="{{p.radio}}"><sc-if value="{{p.on}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></div>
      </button>
    </sc-for>
  </div>
  <div style="flex: 1"></div>
  <button class="btn btn-p" disabled="{{noProfile}}" onClick="{{goTeam}}">Continuar</button>
  <button class="lnk" style="align-self: center" onClick="{{skipProfile}}">Pular</button>
</div>
</sc-if>

<!-- ============ 6. MONTE SUA EQUIPE ============ -->
<sc-if value="{{isTeam}}">
<div class="scr" style="background: #fff">
  <div style="padding: 18px 20px 0; flex: none">
    <button class="ib" aria-label="Voltar" onClick="{{goProfile}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <h1 class="h1" style="margin-top: 22px">Monte sua equipe.</h1>
    <p class="sub">Assistentes fazem o trabalho do escritório por você. Já marquei os que combinam com o seu jeito de trabalhar.</p>
  </div>
  <div class="noscroll" style="flex: 1; overflow-y: auto; padding: 18px 20px 12px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{teamCards}}" as="t">
        <button class="b" style="{{t.style}}" onClick="{{t.toggle}}" disabled="{{t.soon}}">
          <div style="display: flex; justify-content: space-between; align-items: flex-start">
            <div style="{{t.mm.wrap}}; justify-content: flex-start"><div style="{{t.mm.body}}"><span style="{{t.mm.eye}}"></span><span style="{{t.mm.eye}}"></span></div></div>
            <sc-if value="{{t.avail}}"><div style="{{t.check}}"><sc-if value="{{t.on}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></div></sc-if>
          </div>
          <div style="font-weight: 800; font-size: 16px; margin-top: 10px">{{t.name}}</div>
          <div style="color: #555E6C; font-size: 13px; margin-top: 2px; line-height: 1.35">{{t.short}}</div>
          <sc-if value="{{t.rec}}">
            <span class="pill" style="background: #fff; color: #0A5A42; border: 1px solid #CDE3DA; margin-top: 8px; align-self: flex-start">Recomendado</span>
          </sc-if>
          <sc-if value="{{t.soon}}">
            <span class="pill" style="background: #EEF0F3; color: #5E6774; margin-top: 8px; align-self: flex-start">Em breve</span>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </div>
  <div style="padding: 10px 20px 22px; display: flex; flex-direction: column; flex: none; border-top: 1px solid #F0F2F4">
    <button class="btn btn-p" disabled="{{noneSelected}}" onClick="{{goReady}}">{{teamCta}}</button>
  </div>
</div>
</sc-if>

<!-- ============ 7. PRONTO ============ -->
<sc-if value="{{isReady}}">
<div class="scr" style="background: #fff">
  <sc-for list="{{readyMascots}}" as="w">
    <div class="float" style="{{w.pos}}">
      <div style="{{w.m.wrap}}"><div style="{{w.m.body}}"><span style="{{w.m.eye}}"></span><span style="{{w.m.eye}}"></span></div></div>
    </div>
  </sc-for>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 40px; position: relative">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: {{accent}}; display: flex; align-items: center; justify-content: center; margin-bottom: 18px">
      <div style="width: 15px; height: 15px; border-radius: 4px; background: #fff"></div>
    </div>
    <h1 class="h1">{{readyTitle}}</h1>
    <p class="sub" style="max-width: 280px">Agora é só combinar o trabalho conversando com cada um no chat.</p>
  </div>
  <div style="padding: 0 20px 34px; position: relative">
    <button class="btn btn-p" onClick="{{goHome}}">Começar</button>
  </div>
</div>
</sc-if>

<!-- ============ 8. INÍCIO ============ -->
<sc-if value="{{isHome}}">
<div class="scr" style="background: #fff">
  <div style="display: flex; align-items: center; gap: 12px; padding: 20px 20px 8px">
    <button class="b" aria-label="Sua conta" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid #E3E6EA; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #3A424E" onClick="{{tapAvatar}}">{{initials}}</button>
    <div style="flex: 1; font-size: 22px; font-weight: 800; letter-spacing: -.01em">{{hello}}</div>
    <button class="ib" aria-label="Novo assistente" style="opacity: .4; cursor: default" disabled="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>
  <div style="margin: 10px 20px 8px; background: #EEF0F3; border-radius: 14px; padding: 4px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
    <button class="b" style="{{tabA}}" onClick="{{tabAssist}}">Assistentes</button>
    <button class="b" style="{{tabS}}" onClick="{{tabClients}}">Clientes</button>
  </div>
  <div class="noscroll" style="flex: 1; overflow-y: auto; padding-bottom: 110px">
    <sc-if value="{{isTabAssist}}">
      <sc-for list="{{homeRows}}" as="r">
        <button class="b row" onClick="{{r.open}}">
          <div style="{{r.m.wrap}}"><div style="{{r.m.body}}"><span style="{{r.m.eye}}"></span><span style="{{r.m.eye}}"></span></div></div>
          <div style="flex: 1; min-width: 0">
            <div style="display: flex; align-items: center; gap: 8px; min-width: 0">
              <span style="font-weight: 700; font-size: 16px; white-space: nowrap">{{r.name}}<span style="font-weight: 400; color: #5E6774"> · {{r.role}}</span></span>
              <sc-if value="{{r.next}}"><span class="pill" style="background: var(--acs); color: {{accentText}}">Próximo</span></sc-if>
            </div>
            <div style="{{r.prevStyle}}">{{r.preview}}</div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none">
            <span style="font-size: 12px; color: #6B7380">{{r.time}}</span>
            <sc-if value="{{r.unread}}"><span class="dot"></span></sc-if>
          </div>
        </button>
      </sc-for>
    </sc-if>

    <sc-if value="{{isTabClients}}">
      <div style="padding: 4px 20px 2px">
        <div style="display: flex; align-items: center; gap: 8px; height: 42px; border-radius: 12px; background: #F0F2F4; padding: 0 12px">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6B7380" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
          <label style="position: absolute; left: -9999px" for="cq">Buscar cliente</label>
          <input id="cq" value="{{clientQuery}}" onChange="{{onClientQuery}}" placeholder="Buscar cliente" autocomplete="off" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 15px; color: #14181F">
        </div>
      </div>
      <sc-for list="{{clientSections}}" as="sec">
        <div style="display: flex; align-items: center; gap: 8px; padding: 14px 20px 2px; min-height: 30px">
          <span style="flex: 1; font-size: 12px; font-weight: 700; color: #6B7380; letter-spacing: .04em">{{sec.t}}</span>
          <sc-if value="{{sec.hasCta}}">
            <button class="b" style="height: 30px; padding: 0 12px; border-radius: 99px; border: 1px solid #DFE3E8; background: #fff; font-weight: 700; font-size: 12.5px" onClick="{{sec.cta}}">Pedir confirmação</button>
          </sc-if>
        </div>
        <sc-for list="{{sec.rows}}" as="r">
          <button class="b row" style="gap: 12px" onClick="{{r.open}}">
            <div style="{{r.avatar}}">{{r.ini}}</div>
            <div style="flex: 1; min-width: 0">
              <div style="display: flex; align-items: center; gap: 8px">
                <span style="flex: 1; min-width: 0; font-weight: 700; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.n}}</span>
                <span style="{{r.whenStyle}}">{{r.when}}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 8px; margin-top: 3px">
                <span style="flex: 1; min-width: 0; font-size: 13.5px; color: #5E6774; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.d}}</span>
                <span class="pill" style="{{r.stStyle}}">{{r.st}}</span>
              </div>
            </div>
          </button>
        </sc-for>
      </sc-for>
      <sc-if value="{{clientsEmpty}}">
        <div style="padding: 48px 40px 0; text-align: center; font-size: 14px; color: #5E6774; line-height: 1.5">Nenhum cliente com esse nome. Quando alguém novo chamar no WhatsApp, ele aparece aqui.</div>
      </sc-if>
    </sc-if>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 30px; display: flex; justify-content: center">
    <button class="b" style="height: 56px; padding: 0 26px; border-radius: 99px; background: {{accent}}; color: #fff; font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 24px rgba(14,30,24,.22)" onClick="{{startRecHome}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      Contar o que fiz
    </button>
  </div>

  <sc-if value="{{coachOn}}">
    <div style="position: absolute; inset: 0; background: rgba(14,19,25,.42); z-index: 30; animation: fade .2s"></div>
    <div style="{{coachStyle}}">
      <div style="font-weight: 800; font-size: 15px">{{coachTitle}}</div>
      <div style="font-size: 14px; color: #4A5260; line-height: 1.45; margin-top: 4px">{{coachText}}</div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px">
        <span style="font-size: 12px; color: #6B7380">{{coachStep}}</span>
        <button class="b" style="height: 36px; padding: 0 16px; border-radius: 99px; background: {{accent}}; color: #fff; font-weight: 700; font-size: 14px" onClick="{{coachNext}}">Próximo</button>
      </div>
    </div>
  </sc-if>
</div>
</sc-if>

<!-- ============ 9. CONVERSA (assistente ou atendimento) ============ -->
<sc-if value="{{isConvo}}">
<div class="scr" style="background: #F5F6F8">
  <div style="display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; flex: none">
    <button class="ib" aria-label="Voltar" onClick="{{goBack}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <button class="b" style="display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #E3E6EA; border-radius: 99px; padding: 5px 14px 5px 6px; min-width: 0" onClick="{{tapHeader}}">
      <sc-if value="{{hdr.hasMascot}}">
        <div style="{{hdr.m.wrap}}"><div style="{{hdr.m.body}}"><span style="{{hdr.m.eye}}"></span><span style="{{hdr.m.eye}}"></span></div></div>
      </sc-if>
      <sc-if value="{{hdr.isJob}}">
        <div style="{{hdr.avatar}}">{{hdr.ini}}</div>
      </sc-if>
      <div style="min-width: 0">
        <div style="font-weight: 700; font-size: 14.5px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{hdr.title}}</div>
        <div style="display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #5E6774; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">
          <sc-if value="{{hdr.working}}"><span class="recdot" style="width: 6px; height: 6px; border-radius: 50%; background: {{accent}}; flex: none"></span></sc-if>
          {{hdr.status}}
        </div>
      </div>
    </button>
  </div>

  <sc-if value="{{pinOn}}">
    <div style="margin: 0 16px 6px; background: #fff; border: 1px solid #E9ECEF; border-radius: 16px; padding: 10px 10px 8px; flex: none">
      <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px 8px">
        <span style="font-size: 11px; font-weight: 700; color: #6B7380; letter-spacing: .04em; flex: none">{{pinLabel}}</span>
        <span style="flex: 1; min-width: 0; font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{pinTitle}}</span>
        <span class="pill" style="{{pinStyle}}">{{pinSt}}</span>
      </div>
      <div style="display: flex; align-items: flex-start">
        <sc-for list="{{steps}}" as="sp">
          <sc-if value="{{sp.notFirst}}"><span style="{{sp.lineStyle}}"></span></sc-if>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; width: 66px">
            <span style="{{sp.dotStyle}}">
              <sc-if value="{{sp.done}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
              <sc-if value="{{sp.skip}}"><span style="width: 8px; height: 2px; border-radius: 2px; background: #9AA1AB"></span></sc-if>
            </span>
            <span style="{{sp.labelStyle}}">{{sp.l}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <div class="noscroll" ref="{{chatRef}}" style="flex: 1; overflow-y: auto; padding: 8px 18px 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{msgs}}" as="m">
      <div class="msg" data-hl="{{m.hl}}" style="{{m.wrapStyle}}">
        <!-- nasceu neste chat / divisor de dia -->
        <sc-if value="{{m.isSys}}">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0">
            <sc-if value="{{m.hasWhen}}"><span style="font-size: 12px; color: #6B7380">{{m.when}}</span></sc-if>
            <div style="display: flex; align-items: center; gap: 8px; width: 100%">
              <span style="flex: 1; height: 1px; background: #E3E6EA"></span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #4A5260">
                <sc-if value="{{m.hasMs}}"><div style="{{m.ms.wrap}}"><div style="{{m.ms.body}}"><span style="{{m.ms.eye}}"></span><span style="{{m.ms.eye}}"></span></div></div></sc-if>
                <b>{{m.who}}</b> {{m.text}}
              </span>
              <span style="flex: 1; height: 1px; background: #E3E6EA"></span>
            </div>
          </div>
        </sc-if>
        <!-- linha de sistema -->
        <sc-if value="{{m.isLine}}">
          <div style="display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 12.5px; color: #5E6774; text-align: center; padding: 2px 0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            <span>{{m.text}}</span>
            <sc-if value="{{m.hasAct}}">
              <span>·</span><button class="b" style="font-weight: 700; color: {{accent}}; font-size: 12.5px; min-height: 32px" onClick="{{m.actFn}}">{{m.act}}</button>
            </sc-if>
          </div>
        </sc-if>
        <!-- atividade do assistente na conversa de um cliente -->
        <sc-if value="{{m.isRef}}">
          <button class="b" style="display: flex; align-items: center; gap: 10px; width: 100%; background: #fff; border: 1px solid #E3E6EA; border-radius: 16px; padding: 10px 12px" onClick="{{m.go}}">
            <div style="{{m.avatar}}">{{m.ini}}</div>
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 12px; color: #6B7380"><b style="color: #14181F">{{m.name}}</b> · {{m.when}}</div>
              <div style="font-size: 14px; line-height: 1.4; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{m.text}}</div>
              <div style="font-size: 12.5px; font-weight: 700; color: {{accent}}; margin-top: 4px">Ver na conversa {{m.de}}</div>
            </div>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA1AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </button>
        </sc-if>
        <!-- WhatsApp com o cliente -->
        <sc-if value="{{m.isWa}}">
          <div style="{{m.rowStyle}}">
            <div style="{{m.bubbleStyle}}">
              <div style="display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: #0F6B45">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.4-4A8 8 0 1 1 8.6 19z"></path></svg>
                {{m.label}}
              </div>
              <div style="font-size: 14px; line-height: 1.45; margin-top: 3px; color: #14181F">{{m.text}}</div>
              <sc-if value="{{m.hasButtons}}">
                <div style="display: flex; gap: 6px; margin-top: 8px">
                  <sc-for list="{{m.buttons}}" as="wb">
                    <span style="flex: 1; text-align: center; font-size: 12.5px; font-weight: 700; color: #0F6B45; background: #fff; border: 1px solid #CBE7D8; border-radius: 10px; padding: 6px 4px">{{wb}}</span>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </div>
        </sc-if>
        <!-- atendimento anterior -->
        <sc-if value="{{m.isPast}}">
          <div class="card" style="padding: 12px 14px; display: flex; align-items: center; gap: 12px; background: #FAFBFC">
            <div style="width: 36px; height: 36px; border-radius: 11px; background: #E3F4EC; display: flex; align-items: center; justify-content: center; flex: none">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0F6B45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </div>
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 11px; font-weight: 700; color: #6B7380; letter-spacing: .04em">ATENDIMENTO · {{m.when}}</div>
              <div style="font-weight: 700; font-size: 14.5px; margin-top: 2px">{{m.title}}</div>
              <div style="font-size: 12.5px; color: #5E6774; margin-top: 1px">{{m.sub}}</div>
            </div>
            <span class="pill" style="{{m.stStyle}}">{{m.st}}</span>
          </div>
        </sc-if>
        <!-- começo de um atendimento -->
        <sc-if value="{{m.isStart}}">
          <div style="display: flex; align-items: center; gap: 8px; padding: 6px 0 2px">
            <span style="flex: 1; height: 1px; background: #D5D9DF"></span>
            <span style="font-size: 12px; font-weight: 700; color: #3A424E; letter-spacing: .02em">Novo atendimento · {{m.text}}</span>
            <span style="flex: 1; height: 1px; background: #D5D9DF"></span>
          </div>
        </sc-if>
        <!-- aviso -->
        <sc-if value="{{m.isNotice}}">
          <div style="display: flex; justify-content: center">
            <span style="background: #ECEEF1; color: #4A5260; font-size: 13.5px; font-weight: 500; padding: 8px 14px; border-radius: 16px; text-align: center; line-height: 1.4; max-width: 92%">{{m.text}}</span>
          </div>
        </sc-if>
        <!-- texto do assistente -->
        <sc-if value="{{m.isBot}}">
          <div>
            <sc-if value="{{m.hasWho}}">
              <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px">
                <div style="{{m.ms.wrap}}"><div style="{{m.ms.body}}"><span style="{{m.ms.eye}}"></span><span style="{{m.ms.eye}}"></span></div></div>
                <span style="font-size: 12.5px; font-weight: 700">{{m.who}}</span>
                <span style="font-size: 12.5px; color: #6B7380">{{m.role}}</span>
              </div>
            </sc-if>
            <sc-for list="{{m.paras}}" as="pg">
              <p style="margin: 0 0 6px; font-size: 15.5px; line-height: 1.5">{{pg}}</p>
            </sc-for>
          </div>
        </sc-if>
        <!-- bolha do usuário -->
        <sc-if value="{{m.isUser}}">
          <div style="display: flex; justify-content: flex-end">
            <div style="max-width: 82%; background: #fff; border: 1px solid #E3E6EA; padding: 10px 14px; border-radius: 18px 18px 6px 18px; font-size: 15px; line-height: 1.45; box-shadow: 0 1px 2px rgba(0,0,0,.03)"><sc-for list="{{m.parts}}" as="mp"><span style="{{mp.style}}">{{mp.t}}</span></sc-for></div>
          </div>
        </sc-if>
        <!-- conecte -->
        <sc-if value="{{m.isConnect}}">
          <div class="card" style="padding: 14px 0 4px; overflow: hidden">
            <div style="font-weight: 700; font-size: 15px; padding: 0 16px 6px">Conecte para eu começar</div>
            <sc-for list="{{m.items}}" as="it">
              <div style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 16px; min-height: 56px">
                <div style="width: 40px; height: 40px; border-radius: 12px; background: #F0F2F4; display: flex; align-items: center; justify-content: center; flex: none">
                  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5E6774" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
                </div>
                <div style="flex: 1; min-width: 0">
                  <div style="font-weight: 600; font-size: 15px">{{it.n}}</div>
                  <div style="font-size: 13px; color: #5E6774; margin-top: 1px">{{it.w}}</div>
                </div>
                <span class="pill" style="background: #F0F2F4; color: #5E6774; font-weight: 600">{{it.av}}</span>
              </div>
            </sc-for>
            <sc-if value="{{m.active}}">
              <div style="display: flex; justify-content: flex-end; padding: 0 4px">
                <button class="lnk" style="color: {{accent}}; font-weight: 600; font-size: 14.5px" onClick="{{m.skip}}">Agora não</button>
              </div>
            </sc-if>
          </div>
        </sc-if>
        <!-- pergunta com opções -->
        <sc-if value="{{m.isQ}}">
          <div class="card" style="padding-top: 14px; overflow: hidden">
            <div style="font-weight: 700; font-size: 15px; padding: 0 14px 12px; line-height: 1.4">{{m.q}}</div>
            <sc-for list="{{m.opts}}" as="o">
              <button class="opt" onClick="{{o.pick}}" disabled="{{o.off}}">
                <span class="key">{{o.key}}</span>
                <span style="flex: 1">
                  <span style="{{o.lStyle}}">{{o.l}}</span>
                  <sc-if value="{{o.hasS}}"><span style="display: block; font-size: 12.5px; color: #5E6774; margin-top: 1px">{{o.s}}</span></sc-if>
                </span>
                <sc-if value="{{o.soon}}"><span class="pill" style="background: #F0F2F4; color: #5E6774; font-weight: 600">Em breve</span></sc-if>
                <sc-if value="{{o.arrow}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA1AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></sc-if>
              </button>
            </sc-for>
          </div>
        </sc-if>
        <!-- ficha -->
        <sc-if value="{{m.isFicha}}">
          <div class="card" style="overflow: hidden">
            <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #F0F2F4">
              <div style="flex: 1">
                <div style="font-weight: 800; font-size: 15.5px">{{m.title}}</div>
                <div style="font-size: 13px; color: #5E6774">{{m.role}}</div>
              </div>
              <sc-if value="{{m.draft}}"><span class="pill" style="background: #F0F2F4; color: #5E6774; font-weight: 600">Rascunho</span></sc-if>
              <sc-if value="{{m.ok}}"><button class="b" style="height: 28px; padding: 0 12px; border-radius: 99px; background: var(--acs); font-weight: 700; font-size: 12px" onClick="{{m.open}}">Ver ficha</button></sc-if>
            </div>
            <dl style="margin: 0; padding: 8px 16px 10px">
              <sc-for list="{{m.rows}}" as="r">
                <div class="kv">
                  <dt>{{r.k}}</dt>
                  <dd>{{r.v}} <sc-if value="{{r.rot}}"><span style="font-size: 12px; font-weight: 600; color: #5E6774; margin-left: 4px">↻ Rotina</span></sc-if></dd>
                </div>
              </sc-for>
            </dl>
            <sc-if value="{{m.draft}}">
              <div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid #F0F2F4">
                <span style="flex: 1; font-size: 12.5px; color: #5E6774">Dá para mudar depois, é só falar.</span>
                <button class="b" style="height: 40px; padding: 0 16px; border-radius: 99px; border: 1px solid #DFE3E8; font-weight: 700; font-size: 14px" onClick="{{m.adjust}}" disabled="{{m.locked}}">Ajustar</button>
                <button class="b" style="height: 40px; padding: 0 16px; border-radius: 99px; background: {{accent}}; color: #fff; font-weight: 700; font-size: 14px" onClick="{{m.approve}}" disabled="{{m.locked}}">Está certo</button>
              </div>
            </sc-if>
          </div>
        </sc-if>
        <!-- pix de teste -->
        <sc-if value="{{m.isTestPix}}">
          <div class="card" style="overflow: hidden">
            <div style="padding: 14px 16px 0; font-size: 14px; line-height: 1.45">Para conferir a chave, copie este Pix de teste de R$ 0,01, cole no app do seu banco em "Pix copia e cola" e veja se aparece o seu nome. Não precisa pagar.</div>
            <div style="margin: 10px 16px 0; padding: 8px 12px; border-radius: 12px; background: #F0F2F4; font-size: 12px; color: #5E6774; line-height: 1.4; word-break: break-all">{{m.code}}</div>
            <div style="display: flex; justify-content: flex-end; padding: 0 4px">
              <button class="lnk" style="color: {{accent}}; font-weight: 600; font-size: 14.5px" onClick="{{m.copy}}">{{m.copyLabel}}</button>
            </div>
          </div>
        </sc-if>
        <!-- visita -->
        <sc-if value="{{m.isVisit}}">
          <div class="card" style="padding: 12px 14px; display: flex; align-items: center; gap: 12px">
            <div style="width: 40px; height: 40px; border-radius: 12px; background: #E7EEFF; display: flex; align-items: center; justify-content: center; flex: none">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2747A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
            </div>
            <div style="flex: 1; min-width: 0">
              <div style="font-weight: 700; font-size: 14.5px">{{m.title}}</div>
              <div style="font-size: 12.5px; color: #5E6774; margin-top: 1px">{{m.sub}}</div>
            </div>
            <span class="pill" style="{{m.stStyle}}">{{m.st}}</span>
          </div>
        </sc-if>
        <!-- registro da visita / do serviço -->
        <sc-if value="{{m.isRecord}}">
          <div class="card" style="overflow: hidden">
            <div style="padding: 14px 16px 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <div style="font-weight: 800; font-size: 15.5px">{{m.title}}</div>
              <span class="pill" style="background: #F0F2F4; color: #5E6774">{{m.when}}</span>
            </div>
            <dl style="margin: 0; padding: 4px 16px 6px">
              <sc-for list="{{m.rows}}" as="r">
                <div class="kv"><dt>{{r.k}}</dt><dd>{{r.v}}</dd></div>
              </sc-for>
            </dl>
            <sc-if value="{{m.trOpen}}">
              <div style="margin: 0 16px 6px; padding: 10px 12px; border-radius: 12px; background: #F5F6F8; display: flex; flex-direction: column; gap: 6px">
                <sc-for list="{{m.tr}}" as="tl">
                  <div style="font-size: 13.5px; line-height: 1.45; color: #2A313B">{{tl}}</div>
                </sc-for>
              </div>
            </sc-if>
            <div style="border-top: 1px solid #F0F2F4; padding: 0 6px">
              <button class="lnk" style="font-size: 13.5px; font-weight: 600; color: #4A5260" onClick="{{m.toggle}}">{{m.trLabel}}</button>
            </div>
          </div>
        </sc-if>
        <!-- orçamento enviado -->
        <sc-if value="{{m.isQuote}}">
          <div class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; align-items: center; gap: 12px">
              <div style="width: 40px; height: 40px; border-radius: 12px; background: #FFEBD9; display: flex; align-items: center; justify-content: center; flex: none">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A4B0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5M10 13h6M10 17h4"></path></svg>
              </div>
              <div style="flex: 1; min-width: 0">
                <div style="font-weight: 800; font-size: 18px">{{m.total}}</div>
                <div style="font-size: 12.5px; color: #5E6774">{{m.sub}}</div>
              </div>
            </div>
            <div><span class="pill" style="{{m.stStyle}}">{{m.st}}</span></div>
          </div>
        </sc-if>
        <!-- confirmação -->
        <sc-if value="{{m.isConfirm}}">
          <div style="display: flex; flex-direction: column; gap: 10px">
            <div class="card" style="overflow: hidden">
              <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #F0F2F4">
                <div style="width: 32px; height: 32px; border-radius: 50%; border: 1px solid #E3E6EA; display: flex; align-items: center; justify-content: center; flex: none">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E6774" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path></svg>
                </div>
                <div style="min-width: 0">
                  <div style="font-weight: 700; font-size: 14.5px">{{m.title}}</div>
                  <div style="font-size: 12.5px; color: #5E6774">{{m.sub}}</div>
                </div>
              </div>
              <dl style="margin: 0; padding: 8px 16px 12px">
                <sc-for list="{{m.rows}}" as="r">
                  <div class="kv"><dt>{{r.k}}</dt><dd>{{r.v}}</dd></div>
                </sc-for>
                <sc-for list="{{m.avisos}}" as="av">

        <button class="b" aria-label="Enviar" style="{{sendStyle}}" onClick="{{send}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
      </div>
    </div>

<sc-if value="{{isRec}}">
<div class="scr" style="background: #fff; padding: 16px 20px 26px">
  <div style="display: flex; justify-content: space-between">
    <button class="ib" aria-label="Voltar" onClick="{{cancelRec}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
  </div>
  <h1 class="h1" style="margin-top: 22px">{{recTitle}}</h1>
  <div style="display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap">
    <span class="pill" style="background: #F0F2F4; color: #5E6774; height: 28px; padding: 0 10px">Hoje, 09:38</span>
    <sc-if value="{{recListening}}"><span class="pill" style="background: var(--acs); color: {{accentText}}; height: 28px; padding: 0 10px"><span class="recdot" style="width: 6px; height: 6px; border-radius: 50%; background: {{accent}}"></span> Ouvindo</span></sc-if>
    <sc-if value="{{isSumm}}"><span class="pill" style="background: #F0F2F4; color: #5E6774; height: 28px; padding: 0 10px">Resumindo…</span></sc-if>
  </div>
  <div style="flex: 1; overflow-y: auto; margin-top: 22px; display: flex; flex-direction: column; gap: 16px" class="noscroll">
    <sc-if value="{{recListening}}">
      <p style="margin: 0; color: #5E6774; font-size: 15px; line-height: 1.5">{{recPrompt}}</p>
    </sc-if>
    <sc-for list="{{recLines}}" as="tl">
      <div class="msg">
        <div style="font-size: 12px; color: #5E6774; font-weight: 600">Você</div>
        <div style="font-size: 16px; line-height: 1.5; margin-top: 2px">{{tl}}</div>
      </div>
    </sc-for>
    <sc-if value="{{recAsking}}">
      <div class="card msg" style="padding-top: 14px; overflow: hidden; border-color: #E3E6EA">
        <div style="padding: 0 14px 12px">
          <div style="font-weight: 700; font-size: 15px; line-height: 1.4">{{recAskTitle}}</div>
          <div style="font-size: 13px; color: #5E6774; margin-top: 2px">{{recAskSub}}</div>
        </div>
        <sc-for list="{{recAskOpts}}" as="o">
          <button class="opt" onClick="{{o.pick}}">
            <span class="key">{{o.key}}</span>
            <span style="flex: 1">
              <span style="{{o.lStyle}}">{{o.l}}</span>
              <sc-if value="{{o.hasS}}"><span style="display: block; font-size: 12.5px; color: #5E6774; margin-top: 1px">{{o.s}}</span></sc-if>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA1AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </button>
        </sc-for>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{recHint}}">
    <div style="align-self: center; font-size: 13px; color: #5E6774; margin-bottom: 10px">Toque em Finalizar quando terminar de contar.</div>
  </sc-if>
  <sc-if value="{{isSumm}}">
    <div style="height: 58px; border-radius: 99px; background: #F0F2F4; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #3A424E">{{recSumm}}</div>
  </sc-if>
  <sc-if value="{{recListening}}">
    <div style="height: 62px; border-radius: 99px; background: {{accent}}; display: flex; align-items: center; padding: 0 8px; gap: 12px; color: #fff">
      <div style="width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; gap: 4px" aria-hidden="true"><span style="width: 4px; height: 14px; background: #fff; border-radius: 2px"></span><span style="width: 4px; height: 14px; background: #fff; border-radius: 2px"></span></div>
      <div class="wave" style="display: flex; align-items: center; gap: 3px; height: 20px" aria-hidden="true"><span></span><span style="animation-delay: .15s"></span><span style="animation-delay: .3s"></span><span style="animation-delay: .45s"></span></div>
      <span style="font-weight: 700; font-variant-numeric: tabular-nums">{{recTime}}</span>
      <div style="flex: 1"></div>
      <sc-if value="{{recCanFinish}}">
        <button class="b" style="height: 46px; padding: 0 20px; border-radius: 99px; background: #fff; color: #14181F; font-weight: 700" onClick="{{finishRec}}">Finalizar</button>
      </sc-if>
      <sc-if value="{{recCantFinish}}">
        <button class="b" style="height: 46px; padding: 0 18px; border-radius: 99px; background: rgba(255,255,255,.16); color: #fff; font-weight: 700" onClick="{{cancelRec}}">Cancelar</button>
      </sc-if>
    </div>
  </sc-if>
</div>
</sc-if>
