<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9ECEF}
a{color:#0E7C5A}a:hover{color:#0A5A42}
*{box-sizing:border-box}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.b{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.btn{height:54px;border-radius:16px;border:0;font:inherit;font-weight:700;font-size:16px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;flex:none}
.btn-p{background:var(--ac);color:#fff}
.btn-p:disabled{opacity:.32;cursor:default}
.btn-g{background:rgba(255,255,255,.12);color:#fff}
.btn-s{background:#fff;color:#14181F;border:1px solid #DFE3E8}
.btn-d{background:#14181F;color:#fff}
.btn:active{transform:scale(.985)}
.lnk{border:0;background:none;font:inherit;font-weight:700;font-size:15px;color:#14181F;cursor:pointer;padding:12px;min-height:44px}
.ib{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid #E3E6EA;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#14181F;padding:0;flex:none}
.h1{font-size:29px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:0}
.sub{color:#555E6C;font-size:15px;line-height:1.45;margin:8px 0 0}
.field{height:56px;border-radius:16px;border:1.5px solid #DFE3E8;background:#fff;padding:0 16px;font:inherit;font-size:16px;width:100%;color:#14181F}
.field:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px var(--acs)}
.card{background:#fff;border-radius:20px;border:1px solid #E9ECEF}
.sheetbg{position:absolute;inset:0;background:rgba(14,19,25,.42);animation:fade .2s ease-out;z-index:40;border:0;padding:0;width:100%;cursor:default}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px 30px;animation:up .3s cubic-bezier(.2,.8,.2,1);max-height:90%;display:flex;flex-direction:column;z-index:41}
.grab{width:40px;height:5px;border-radius:9px;background:#D7DBE0;margin:0 auto 16px;flex:none}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:none;font:inherit;text-align:left;cursor:pointer;border-top:1px solid #F0F2F4;color:#14181F;min-height:48px}
.opt:hover{background:#F8F9FA}
.key{width:24px;height:24px;border-radius:7px;border:1px solid #D5D9DF;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#555E6C;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:7px 0;font-size:14px;line-height:1.4}
.kv dt{color:#5E6774}
.kv dd{margin:0;color:#14181F}
.float{animation:bob 5.5s ease-in-out infinite}
.msg{animation:in .28s ease-out}
.think{animation:pulse 1.2s ease-in-out infinite}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:10px 20px;min-height:68px}
.row:hover{background:#F2F4F6}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ac);flex:none}
.recdot{animation:pulse 1s ease-in-out infinite}
.wave span{display:block;width:3px;border-radius:3px;background:#fff;animation:wave 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1)}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes wave{0%,100%{height:6px}50%{height:18px}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-8px)}100%{opacity:1;transform:translate(-50%,0)}}
</style>

<style>
html,body{height:100%}
body{margin:0;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#E4E7EB;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.bar{display:flex;align-items:center;gap:14px;font-size:13px;color:#4A5260}
.bar button{font:inherit;font-weight:700;border:1px solid #CBD0D7;background:#fff;border-radius:99px;padding:7px 14px;cursor:pointer;color:#14181F}
#stage{position:relative}
#phone{width:390px;height:844px;transform-origin:top left;position:absolute;top:0;left:0;border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #14181F,0 30px 80px rgba(0,0,0,.28)}
</style>
</head>
<body>
<div class="bar"><span>Protótipo · clique para navegar</span><button type="button" onclick="location.reload()">Recomeçar</button></div>
<div id="stage"><div id="phone"><div id="app"></div></div></div>
<template id="tpl">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F6F8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14181F; --ac: {{accent}}; --acs: {{accentSoft}}">

<!-- ============ 1. BOAS-VINDAS ============ -->
<sc-if value="{{isWelcome}}" hint-placeholder-val="{{true}}">
<div class="scr" style="background: #0E1A15; color: #fff">
  <div style="position: relative; height: 470px; flex: none">
    <sc-for list="{{welcomeMascots}}" as="w" hint-placeholder-count="6">
      <div class="float" style="{{w.pos}}">
        <div style="{{w.m.wrap}}"><div style="{{w.m.body}}"><span style="{{w.m.eye}}"></span><span style="{{w.m.eye}}"></span></div></div>
      </div>
    </sc-for>
    <div style="position: absolute; left: 62px; top: 150px; width: 266px; display: flex; flex-direction: column; gap: 8px">
      <div style="align-self: flex-start; background: rgba(255,255,255,.1); color: #E8EEEB; padding: 10px 14px; border-radius: 18px 18px 18px 6px; font-size: 13.5px; line-height: 1.4">Boa tarde! Tem horário amanhã pra limpar o ar?</div>
      <div style="align-self: flex-end; background: #fff; color: #14181F; padding: 10px 14px; border-radius: 18px 18px 6px 18px; font-size: 13.5px; line-height: 1.4; max-width: 230px">
        <div style="font-size: 11px; font-weight: 700; color: #3E6FD8; margin-bottom: 2px">Lia · Agenda</div>
        Tenho às 9h ou às 14h. Qual fica melhor?
      </div>
      <div style="align-self: flex-end; display: flex; gap: 6px">
        <span class="pill" style="background: rgba(255,255,255,.14); color: #fff; height: 28px; padding: 0 12px">Aprovar</span>
        <span class="pill" style="background: rgba(255,255,255,.06); color: #C9D3CF; height: 28px; padding: 0 12px">Editar</span>
      </div>
    </div>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 22px 34px; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px">
      <div style="width: 26px; height: 26px; border-radius: 8px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <div style="width: 10px; height: 10px; border-radius: 3px; background: #fff"></div>
      </div>
      <span style="font-size: 20px; font-weight: 800; letter-spacing: -.02em">Acme</span>
    </div>
    <h1 style="margin: 0; font-size: 28px; line-height: 1.18; font-weight: 800; letter-spacing: -.02em; text-align: center">Uma equipe que cuida do escritório enquanto você trabalha.</h1>
    <p style="margin: 0 0 14px; text-align: center; color: #B8C4BF; font-size: 15px; line-height: 1.45">Assistentes de IA para a rotina do seu serviço.<br>Grátis para começar.</p>
    <button class="btn btn-p" onClick="{{goName}}">Começar</button>
    <button class="btn btn-g" onClick="{{goName}}">Já tenho conta</button>
  </div>
</div>
</sc-if>

<!-- ============ 2. NOME + O QUE FAZ ============ -->
<sc-if value="{{isName}}" hint-placeholder-val="{{false}}">
<div class="scr" style="background: #fff; padding: 18px 20px 30px">
  <button class="ib" aria-label="Voltar" onClick="{{goWelcome}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
  <h1 class="h1" style="margin-top: 28px">Como quer ser chamado?</h1>
  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 22px">
    <label style="position: absolute; left: -9999px" for="nm">Seu nome</label>
    <input id="nm" class="field" placeholder="Ex.: Carlos da Refrigeração" value="{{name}}" onChange="{{onName}}" autocomplete="off">
    <button class="field" style="display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left" onClick="{{openSegs}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E6774" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></svg>
      <span style="{{segStyle}}">{{segLabel}}</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6774" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </div>
  <div style="flex: 1"></div>
  <button class="btn btn-p" disabled="{{nameEmpty}}" onClick="{{goProfile}}">Continuar</button>
</div>
</sc-if>

<!-- ============ 3. COMO TRABALHA ============ -->
<sc-if value="{{isProfile}}" hint-placeholder-val="{{false}}">
<div class="scr" style="background: #fff; padding: 18px 20px 24px">
  <button class="ib" aria-label="Voltar" onClick="{{goName}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
  <h1 class="h1" style="margin-top: 28px">Como você trabalha hoje?</h1>
  <p class="sub">Assim eu monto a equipe certa para você.</p>
  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 22px">
    <sc-for list="{{profiles}}" as="p" hint-placeholder-count="3">
      <button class="b" style="{{p.style}}" onClick="{{p.pick}}">
        <div style="width: 54px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 3px; flex: none">
          <sc-for list="{{p.people}}" as="pp" hint-placeholder-count="1">
            <div style="{{pp}}"></div>
          </sc-for>
        </div>
        <div style="flex: 1">
          <div style="font-weight: 700; font-size: 16px">{{p.t}}</div>
          <div style="color: #5E6774; font-size: 13.5px; margin-top: 2px">{{p.d}}</div>
        </div>
        <div style="{{p.radio}}"><sc-if value="{{p.on}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></div>
      </button>
    </sc-for>
  </div>
  <div style="font-weight: 700; font-size: 15px; margin-top: 26px">Por onde chegam os pedidos?</div>
  <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px">
    <sc-for list="{{channels}}" as="c" hint-placeholder-count="5">
      <button class="b" style="{{c.style}}" onClick="{{c.toggle}}">{{c.l}}</button>
    </sc-for>
  </div>
  <div style="flex: 1"></div>
  <button class="btn btn-p" disabled="{{noProfile}}" onClick="{{goTeam}}">Continuar</button>
  <button class="lnk" style="align-self: center" onClick="{{skipProfile}}">Pular</button>
</div>
</sc-if>

<!-- ============ 4. MONTE SUA EQUIPE ============ -->
<sc-if value="{{isTeam}}" hint-placeholder-val="{{false}}">
<div class="scr" style="background: #fff">
  <div style="padding: 18px 20px 0; flex: none">
    <button class="ib" aria-label="Voltar" onClick="{{goProfile}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <h1 class="h1" style="margin-top: 22px">Monte sua equipe.</h1>
    <p class="sub">Assistentes fazem o trabalho do escritório por você. Já marquei os que combinam com o seu jeito de trabalhar.</p>
  </div>
  <div class="noscroll" style="flex: 1; overflow-y: auto; padding: 18px 20px 12px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{teamCards}}" as="t" hint-placeholder-count="9">
        <button class="b" style="{{t.style}}" onClick="{{t.toggle}}">
          <div style="display: flex; justify-content: space-between; align-items: flex-start">
            <div style="{{t.mm.wrap}}; justify-content: flex-start"><div style="{{t.mm.body}}"><span style="{{t.mm.eye}}"></span><span style="{{t.mm.eye}}"></span></div></div>
            <div style="{{t.check}}"><sc-if value="{{t.on}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></div>
          </div>
          <div style="font-weight: 800; font-size: 16px; margin-top: 10px">{{t.name}}</div>
          <div style="color: #555E6C; font-size: 13px; margin-top: 2px; line-height: 1.35">{{t.short}}</div>
          <sc-if value="{{t.rec}}" hint-placeholder-val="{{false}}">
            <span class="pill" style="background: #fff; color: #0A5A42; border: 1px solid #CDE3DA; margin-top: 8px; align-self: flex-start">Recomendado</span>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </div>
  <div style="padding: 10px 20px 22px; display: flex; flex-direction: column; flex: none; border-top: 1px solid #F0F2F4">
    <button class="btn btn-p" disabled="{{noneSelected}}" onClick="{{goReady}}">{{teamCta}}</button>
    <button class="lnk" style="align-self: center; display: flex; align-items: center; gap: 6px" onClick="{{newFromTeam}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Criar o meu próprio
    </button>
  </div>
</div>
</sc-if>

<!-- ============ 5. PRONTO ============ -->
<sc-if value="{{isReady}}" hint-placeholder-val="{{false}}">
<div class="scr" style="background: #fff">
  <sc-for list="{{readyMascots}}" as="w" hint-placeholder-count="3">
    <div class="float" style="{{w.pos}}">
      <div style="{{w.m.wrap}}"><div style="{{w.m.body}}"><span style="{{w.m.eye}}"></span><span style="{{w.m.eye}}"></span></div></div>
    </div>
  </sc-for>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 40px; position: relative">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: {{accent}}; display: flex; align-items: center; justify-content: center; margin-bottom: 18px">
      <div style="width: 15px; height: 15px; border-radius: 4px; background: #fff"></div>
    </div>
    <h1 class="h1">{{readyTitle}}</h1>
    <p class="sub" style="max-width: 280px">Agora é só combinar o trabalho conversando com cada um no chat.</p>
  </div>
  <div style="padding: 0 20px 34px; position: relative">
    <button class="btn btn-p" onClick="{{goHome}}">Começar</button>
  </div>
</div>
</sc-if>

<!-- ============ 6. INÍCIO ============ -->
<sc-if value="{{isHome}}" hint-placeholder-val="{{false}}">
<div class="scr" style="background: #fff">
  <div style="display: flex; align-items: center; gap: 12px; padding: 20px 20px 8px">
    <div style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid #E3E6EA; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #3A424E">{{initials}}</div>
    <div style="flex: 1; font-size: 22px; font-weight: 800; letter-spacing: -.01em">{{hello}}</div>
    <button class="ib" aria-label="Novo assistente" onClick="{{newFromHome}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>
  <div style="margin: 10px 20px 8px; background: #EEF0F3; border-radius: 14px; padding: 4px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
    <button class="b" style="{{tabA}}" onClick="{{tabAssist}}">Assistentes</button>
    <button class="b" style="{{tabS}}" onClick="{{tabServ}}">Serviços</button>
  </div>
  <div class="noscroll" style="flex: 1; overflow-y: auto; padding-bottom: 110px">
    <sc-if value="{{isTabAssist}}" hint-placeholder-val="{{true}}">
      <sc-for list="{{homeRows}}" as="r" hint-placeholder-count="3">
        <button class="b row" onClick="{{r.open}}">
          <div style="{{r.m.wrap}}"><div style="{{r.m.body}}"><span style="{{r.m.eye}}"></span><span style="{{r.m.eye}}"></span></div></div>
          <div style="flex: 1; min-width: 0">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="font-weight: 700; font-size: 16px">{{r.name}}</span>
              <sc-if value="{{r.next}}" hint-placeholder-val="{{false}}"><span class="pill" style="background: var(--acs); color: {{accentText}}">Próximo</span></sc-if>
            </div>
            <div style="{{r.prevStyle}}">{{r.preview}}</div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none">
            <span style="font-size: 12px; color: #6B7380">{{r.time}}</span>
            <sc-if value="{{r.unread}}" hint-placeholder-val="{{false}}"><span class="dot"></span></sc-if>
          </div>
        </button>
      </sc-for>
      <button class="b row" onClick="{{openApp}}">
        <div style="width: 50px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none">
          <div style="width: 42px; height: 42px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center"><div style="width: 14px; height: 14px; border-radius: 4px; background: #fff"></div></div>
        </div>
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; align-items: center; gap: 6px">
            <span style="font-weight: 700; font-size: 16px">Acme</span>
            <svg width="16" height="16" viewBox="0 0 24 24" aria-label="Verificado" role="img"><circle cx="12" cy="12" r="10" fill="{{accent}}"></circle><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </div>
          <div style="font-size: 14px; color: #5E6774; margin-top: 2px">Boas-vindas ao app</div>
        </div>
        <span style="font-size: 12px; color: #6B7380">10:27</span>
      </button>
    </sc-if>
    <sc-if value="{{isTabServ}}" hint-placeholder-val="{{false}}">
      <sc-if value="{{hasSvc}}" hint-placeholder-val="{{false}}">
        <button class="b row" onClick="{{openSvc}}">
          <div style="width: 44px; height: 44px; border-radius: 14px; background: #F0F2F4; display: flex; align-items: center; justify-content: center; flex: none">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3A424E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></svg>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-weight: 700; font-size: 16px">João Pereira</div>
            <div style="font-size: 14px; color: #5E6774; margin-top: 2px">Limpeza de split · R$ 350,00</div>
          </div>
          <span class="pill" style="{{svcPillStyle}}">{{svcPill}}</span>
        </button>
      </sc-if>
      <sc-if value="{{noSvc}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 90px 40px 0">
          <div style="width: 52px; height: 52px; border-radius: 16px; background: #F0F2F4; display: flex; align-items: center; justify-content: center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3A424E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
          </div>
          <div style="font-weight: 700; font-size: 16px; margin-top: 16px">Nenhum serviço ainda</div>
          <p style="margin: 6px 0 0; color: #5E6774; font-size: 14px; line-height: 1.5">Toque em Registrar serviço quando terminar uma visita e conte o que fez. Eu preparo a cobrança, a baixa do material e o retorno.</p>
        </div>
      </sc-if>
    </sc-if>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 30px; display: flex; justify-content: center">
    <button class="b" style="height: 56px; padding: 0 26px; border-radius: 99px; background: {{accent}}; color: #fff; font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 24px rgba(14,30,24,.22)" onClick="{{startSvc}}">

    var wrap = 'width:' + Math.round(s * 1.2) + 'px;height:' + s + 'px;display:flex;align-items:center;justify-content:center;flex:none;';
    return { wrap: wrap, body: body, eye: eye };

  }
